<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>검사 직후 결과 화면 · 예시</title><link rel="stylesheet" href="/result-theme.css"><style>body{margin:0;background:#100d20;font-family:Arial,'Noto Sans KR',sans-serif}main{max-width:800px;margin:30px auto;padding:0 18px}.demo-button{display:block;background:#d7ff74;color:#281737;text-align:center;text-decoration:none;padding:19px;border-radius:12px;font-weight:800}.result-demo-banner a{color:inherit}</style><div class="result-demo-banner">검사 직후 화면 미리보기 · 예시 점수 <a href="/premium.html#preview">← 돌아가기</a></div><main><div id="demo-summary" class="health-result-summary"></div><div class="premium-result-next"><h3>다음 챕터 · 프리미엄 통합분석</h3><p>검진결과와 습관의 연결, 개선 우선순위, 12주 실행 로드맵까지.<br>지금 보이는 보라색 카드 디자인으로 PDF 결과지가 제공됩니다.</p><a class="demo-button" href="/report-sample.html">프리미엄 결과지 샘플 열기 →</a></div></main><script src="/report-sample.js"></script><script>const d=window.MANDALA_SAMPLE;const root=document.querySelector('#demo-summary');root.innerHTML='<div class="health-result-kicker"><span>건강만다라 · MY HEALTH MAP</span><span>디자인 미리보기용 예시</span></div><h2>김건강님의 건강 지도</h2><p>8영역의 균형을 살펴보는 나의 생활습관 맵</p><div class="health-result-grid">'+d.areaScores.map(a=>'<div class="health-result-cell '+(a.id===3?'priority':'')+'"><span>'+a.name+' · '+a.sub+'</span><strong>'+a.pctVal+'<small>%</small></strong></div>').join('')+'</div><div class="health-result-insight"><strong>이번 변화의 출발점은 회복과 활동입니다.</strong>예시 응답에서 상대적으로 낮은 두 영역입니다. 실제 검사에서는 본인 응답으로 산출한 점수가 표시됩니다.</div><div class="health-result-footer">첨부 PDF의 예시 점수를 재현한 디자인 샘플 · 실제 검사 산식과 별도</div>';</script></html>
